<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>WR PT — Cyprus Events</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="firebase-config.js"></script>
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getFirestore, collection, query, where, orderBy, limit, getDocs } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
  window._db = getFirestore(initializeApp(window.FIREBASE_CONFIG));
  window._fs = { collection, query, where, orderBy, limit, getDocs };
  window.dispatchEvent(new Event('firebase-ready'));
</script>
<style>
@import url('https://fonts.googleapis.com/css2?family=EB+Garamond:wght@400;500&display=swap');

* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

:root {
  --espresso: #2B2A1A;
  --espresso2: #1a1a10;
  --gold: #C9A84C;
  --gold-dim: #C9A84C33;
  --limestone: #F2EDE2;
  --limestone-dim: #F2EDE244;
  --terracotta: #C04A26;
  --olive: #6F7A3B;
  --card-bg: #232215;
  --border: #C9A84C18;
  --muted: #F2EDE255;
}

html, body { height: 100%; background: var(--espresso2); color: var(--limestone); font-family: -apple-system, sans-serif; overscroll-behavior: none; }

/* HEADER */
.header {
  position: sticky; top: 0; z-index: 20;
  background: var(--espresso2);
  border-bottom: 1px solid var(--border);
  padding: 14px 16px 10px;
}
.header-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
.logo { font-family: 'EB Garamond', Georgia, serif; font-size: 22px; letter-spacing: 4px; line-height: 1; }
.logo span { color: var(--gold); }
.logo-sub { font-size: 8px; letter-spacing: 4px; color: var(--muted); font-family: sans-serif; margin-top: 2px; }

/* LANG TOGGLE */
.lang-toggle { display: flex; gap: 2px; background: var(--card-bg); border: 1px solid var(--border); border-radius: 20px; padding: 3px; }
.lang-btn { padding: 4px 12px; border-radius: 16px; border: none; font-size: 11px; letter-spacing: 1px; font-family: sans-serif; cursor: pointer; transition: all .2s; background: transparent; color: var(--muted); }
.lang-btn.active { background: var(--gold); color: var(--espresso); font-weight: 600; }

/* SEARCH */
.search-wrap { position: relative; margin-bottom: 10px; }
.search { width: 100%; background: var(--card-bg); border: 1px solid var(--border); border-radius: 8px; padding: 9px 14px 9px 36px; color: var(--limestone); font-size: 13px; outline: none; }
.search::placeholder { color: var(--muted); }
.search-icon { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--muted); font-size: 14px; pointer-events: none; }

/* CITY FILTER */
.cities { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding-bottom: 6px; }
.cities::-webkit-scrollbar { display: none; }
.city-btn { flex-shrink: 0; padding: 4px 12px; border-radius: 20px; border: 1px solid var(--border); background: transparent; color: var(--muted); font-size: 11px; font-family: sans-serif; letter-spacing: .5px; cursor: pointer; transition: all .2s; white-space: nowrap; }
.city-btn.active { background: var(--terracotta); border-color: var(--terracotta); color: #fff; font-weight: 600; }

/* CATEGORIES */
.cats { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; }
.cats::-webkit-scrollbar { display: none; }
.cat-btn { flex-shrink: 0; padding: 5px 12px; border-radius: 20px; border: 1px solid var(--border); background: transparent; color: var(--muted); font-size: 11px; font-family: sans-serif; letter-spacing: .5px; cursor: pointer; transition: all .2s; white-space: nowrap; }
.cat-btn.active { background: var(--gold); border-color: var(--gold); color: var(--espresso); font-weight: 600; }

/* PAGES */
.page { display: none; }
.page.active { display: block; }

/* EVENTS */
.events { padding: 12px 16px 90px; display: flex; flex-direction: column; gap: 10px; }

/* CARD */
.card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; cursor: pointer; transition: border-color .2s; position: relative; }
.card:active { opacity: 0.85; }
.card:hover { border-color: var(--gold-dim); }
.card-cat-bar { width: 3px; position: absolute; left: 0; top: 0; bottom: 0; background: var(--gold); }
.card-img { width: 100%; height: 160px; object-fit: cover; display: block; border-radius: 11px 11px 0 0; }
.card-body { padding: 14px 14px 14px 18px; }
.card-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; margin-bottom: 8px; }
.card-cat-label { font-family: sans-serif; font-size: 9px; letter-spacing: 2px; color: var(--gold); text-transform: uppercase; }
.card-emoji { font-size: 18px; flex-shrink: 0; }
.card-title { font-family: 'EB Garamond', Georgia, serif; font-size: 17px; line-height: 1.3; color: var(--limestone); margin-bottom: 10px; }
.card-meta { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 10px; }
.meta-item { font-size: 11px; color: var(--muted); display: flex; align-items: center; gap: 4px; font-family: sans-serif; }
.meta-item strong { color: var(--gold); }
.card-footer { border-top: 1px solid var(--border); padding: 10px 14px 10px 18px; }
.btn-ticket { display: inline-block; width: 100%; background: var(--gold); color: var(--espresso); border: none; border-radius: 8px; padding: 9px 16px; font-size: 11px; letter-spacing: 2px; font-family: sans-serif; font-weight: 700; text-align: center; cursor: pointer; text-decoration: none; }

/* FAV HEART */
.fav-btn { position: absolute; top: 10px; right: 10px; z-index: 2; background: rgba(27,26,16,.7); border: 1px solid var(--border); border-radius: 50%; width: 30px; height: 30px; font-size: 15px; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: background .2s; }
.fav-btn.active { background: rgba(201,168,76,.15); border-color: var(--gold); }

/* STATES */
.loading, .empty { text-align: center; padding: 60px 20px; color: var(--muted); font-family: sans-serif; font-size: 13px; }
.spinner { width: 28px; height: 28px; border: 2px solid var(--border); border-top-color: var(--gold); border-radius: 50%; animation: spin .8s linear infinite; margin: 0 auto 16px; }
@keyframes spin { to { transform: rotate(360deg); } }

/* BOTTOM NAV */
.bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; background: var(--espresso); border-top: 1px solid var(--border); display: flex; padding: 8px 0 max(env(safe-area-inset-bottom), 8px); z-index: 20; }
.nav-item { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: 9px; letter-spacing: 1px; color: var(--muted); font-family: sans-serif; cursor: pointer; padding: 4px 0; }
.nav-item.active { color: var(--gold); }
.nav-icon { font-size: 18px; }

/* MAP PAGE */
.map-page { padding: 0; height: calc(100vh - 145px); position: relative; }
#leaflet-map { width: 100%; height: 100%; z-index: 1; }
.map-info { position: absolute; top: 10px; left: 50%; transform: translateX(-50%); z-index: 10; background: var(--espresso); border: 1px solid var(--border); border-radius: 20px; padding: 6px 14px; font-size: 11px; color: var(--muted); font-family: sans-serif; white-space: nowrap; }

/* SOON / FAV PAGES */
.soon-page, .fav-page { padding: 12px 16px 90px; display: flex; flex-direction: column; gap: 10px; }

/* EVENT MODAL */
.modal-overlay {
  display: none; position: fixed; inset: 0; z-index: 100;
  background: rgba(0,0,0,0.7); backdrop-filter: blur(4px);
}
.modal-overlay.open { display: flex; align-items: flex-end; }
.modal {
  background: var(--espresso); width: 100%;
  border-radius: 20px 20px 0 0;
  max-height: 85vh; overflow-y: auto;
  padding: 0 0 max(env(safe-area-inset-bottom), 20px);
  animation: slideUp .25s ease;
}
@keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
.modal-handle { width: 36px; height: 4px; background: var(--border); border-radius: 2px; margin: 12px auto 0; }
.modal-img { width: 100%; height: 200px; object-fit: cover; border-radius: 0; }
.modal-header { padding: 16px 20px 0; }
.modal-cat { font-size: 9px; letter-spacing: 2px; color: var(--gold); font-family: sans-serif; text-transform: uppercase; margin-bottom: 8px; }
.modal-title { font-family: 'EB Garamond', Georgia, serif; font-size: 22px; line-height: 1.3; color: var(--limestone); margin-bottom: 14px; }
.modal-meta { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 16px; }
.modal-meta .meta-item { font-size: 13px; }
.modal-divider { height: 1px; background: var(--border); margin: 0 20px 16px; }
.modal-body { padding: 0 20px; font-size: 14px; line-height: 1.7; color: var(--limestone-dim); white-space: pre-wrap; }
.modal-footer { padding: 20px; display: flex; flex-direction: column; gap: 10px; }
.modal-close { position: absolute; top: 16px; right: 16px; background: var(--card-bg); border: 1px solid var(--border); color: var(--muted); border-radius: 50%; width: 32px; height: 32px; font-size: 16px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
.btn-share { display: inline-block; width: 100%; background: transparent; color: var(--gold); border: 1px solid var(--gold-dim); border-radius: 8px; padding: 9px 16px; font-size: 11px; letter-spacing: 2px; font-family: sans-serif; font-weight: 700; text-align: center; cursor: pointer; }
</style>
</head>
<body>

<div class="header">
  <div class="header-top">
    <div>
      <div class="logo">WR P<span>T</span></div>
      <div class="logo-sub">CYPRUS · EVENTS</div>
    </div>
    <div class="lang-toggle">
      <button class="lang-btn active" data-lang="ru" onclick="setLang('ru')">RU</button>
      <button class="lang-btn" data-lang="en" onclick="setLang('en')">EN</button>
    </div>
  </div>
  <div class="search-wrap" id="search-wrap">
    <span class="search-icon">⌕</span>
    <input class="search" type="text" id="search" placeholder="Поиск событий...">
  </div>
  <div class="cities" id="cities"></div>
  <div class="cats" id="cats"></div>
</div>

<!-- PAGE: EVENTS -->
<div class="page active" id="page-events">
  <div class="events" id="events">
    <div class="loading"><div class="spinner"></div><div id="loading-text">Загружаем события...</div></div>
  </div>
</div>

<!-- PAGE: SOON -->
<div class="page" id="page-soon">
  <div class="soon-page" id="soon-list">
    <div class="loading"><div class="spinner"></div></div>
  </div>
</div>

<!-- PAGE: MAP -->
<div class="page" id="page-map">
  <div class="map-page">
    <div class="map-info" id="map-info">📍 Кипр — события на карте</div>
    <div id="leaflet-map"></div>
  </div>
</div>

<!-- PAGE: FAVOURITES -->
<div class="page" id="page-fav">
  <div class="fav-page" id="fav-list">
    <div class="loading"><div class="spinner"></div></div>
  </div>
</div>

<!-- BOTTOM NAV -->
<nav class="bottom-nav">
  <div class="nav-item active" id="nav-btn-events" onclick="showPage('events')">
    <div class="nav-icon">◈</div>
    <span id="nav-home">События</span>
  </div>
  <div class="nav-item" id="nav-btn-soon" onclick="showPage('soon')">
    <div class="nav-icon">◷</div>
    <span id="nav-soon">Скоро</span>
  </div>
  <div class="nav-item" id="nav-btn-map" onclick="showPage('map')">
    <div class="nav-icon">◎</div>
    <span id="nav-map">Карта</span>
  </div>
  <div class="nav-item" id="nav-btn-fav" onclick="showPage('fav')">
    <div class="nav-icon">♡</div>
    <span id="nav-fav">Избранное</span>
  </div>
</nav>

<!-- EVENT MODAL -->
<div class="modal-overlay" id="modal-overlay" onclick="closeModal(event)">
  <div class="modal" id="modal" style="position:relative">
    <div class="modal-handle"></div>
    <button class="modal-close" onclick="closeModal()">✕</button>
    <div class="modal-header">
      <div class="modal-cat" id="modal-cat"></div>
      <div class="modal-title" id="modal-title"></div>
      <div class="modal-meta" id="modal-meta"></div>
    </div>
    <div class="modal-divider"></div>
    <div class="modal-body" id="modal-body"></div>
    <div class="modal-footer" id="modal-footer"></div>
  </div>
</div>

<script>
const tg = window.Telegram?.WebApp;
if (tg) { tg.ready(); tg.expand(); }

const T = {
  ru: {
    search: "Поиск событий...",
    loading: "Загружаем события...",
    empty: "Событий не найдено",
    tickets: "БИЛЕТЫ И ПОДРОБНОСТИ",
    share: "ПОДЕЛИТЬСЯ",
    navHome: "События", navSoon: "Скоро", navMap: "Карта", navFav: "Избранное",
    soon: "Ближайшие события",
    favEmpty: "Нет избранных событий",
    cities: { all:"🌍 Все", Limassol:"Лимасол", Nicosia:"Никосия", Larnaca:"Ларнака", Paphos:"Пафос", "Ayia Napa":"Айя-Напа" },
    cats: {
      all:"🌟 Все", nightlife:"🎉 Вечеринки", music:"🎶 Музыка",
      art:"🎨 Арт", food:"🍷 Еда & Вино", networking:"🎤 Нетворкинг",
      culture:"📖 Культура", outdoor:"🌊 Природа", sport:"🏃 Спорт", kids:"👶 Дети"
    }
  },
  en: {
    search: "Search events...",
    loading: "Loading events...",
    empty: "No events found",
    tickets: "TICKETS & DETAILS",
    share: "SHARE",
    navHome: "Events", navSoon: "Soon", navMap: "Map", navFav: "Saved",
    soon: "Upcoming events",
    favEmpty: "No saved events",
    cities: { all:"🌍 All", Limassol:"Limassol", Nicosia:"Nicosia", Larnaca:"Larnaca", Paphos:"Paphos", "Ayia Napa":"Ayia Napa" },
    cats: {
      all:"🌟 All", nightlife:"🎉 Parties", music:"🎶 Music",
      art:"🎨 Art", food:"🍷 Food & Wine", networking:"🎤 Networking",
      culture:"📖 Culture", outdoor:"🌊 Outdoor", sport:"🏃 Sport", kids:"👶 Kids"
    }
  }
};

const CAT_EMOJI = { nightlife:"🎉", music:"🎶", art:"🎨", food:"🍷", networking:"🎤", culture:"📖", outdoor:"🌊", sport:"🏃", kids:"👶", other:"📌" };
const CAT_COLOR = { nightlife:"#C04A26", music:"#C9A84C", art:"#6F7A3B", food:"#C9A84C", networking:"#C04A26", culture:"#6F7A3B", outdoor:"#6F7A3B", sport:"#C04A26", kids:"#C9A84C", other:"#C9A84C" };
const CITIES = ["all", "Limassol", "Nicosia", "Larnaca", "Paphos", "Ayia Napa"];

let lang = "ru";
let currentCat = "all";
let currentCity = "all";
let allEvents = [];
let searchQuery = "";
let fbReady = false;
let currentPage = "events";

// ── FAVOURITES (localStorage) ──────────────────────────────────
function getFavIds() {
  try { return new Set(JSON.parse(localStorage.getItem("wrpt_favs") || "[]")); }
  catch { return new Set(); }
}
function saveFavIds(ids) {
  localStorage.setItem("wrpt_favs", JSON.stringify([...ids]));
}
function toggleFav(eid, btn) {
  const favs = getFavIds();
  if (favs.has(eid)) { favs.delete(eid); btn && btn.classList.remove("active"); btn && (btn.textContent = "♡"); }
  else { favs.add(eid); btn && btn.classList.add("active"); btn && (btn.textContent = "♥"); }
  saveFavIds(favs);
  if (currentPage === "fav") renderFav();
}

// ── LANG ──────────────────────────────────────────────────────
function setLang(l) {
  lang = l;
  document.querySelectorAll(".lang-btn").forEach(b => b.classList.toggle("active", b.dataset.lang === l));
  document.getElementById("search").placeholder = T[l].search;
  const lt = document.getElementById("loading-text");
  if (lt) lt.textContent = T[l].loading;
  document.getElementById("nav-home").textContent = T[l].navHome;
  document.getElementById("nav-soon").textContent = T[l].navSoon;
  document.getElementById("nav-map").textContent = T[l].navMap;
  document.getElementById("nav-fav").textContent = T[l].navFav;
  renderCities();
  renderCats();
  render();
  if (leafletMap) updateMapMarkers();
}

// ── MAP ───────────────────────────────────────────────────────
let leafletMap = null;
const CITY_COORDS = {
  "Limassol": [34.6841, 33.0379], "Nicosia": [35.1856, 33.3823],
  "Larnaca": [34.9009, 33.6281], "Paphos": [34.7754, 32.4242],
  "Famagusta": [35.1264, 33.9497], "Ayia Napa": [34.9877, 33.9879],
  "Protaras": [35.0126, 34.0510],
  "Лимасол": [34.6841, 33.0379], "Никосия": [35.1856, 33.3823],
  "Ларнака": [34.9009, 33.6281], "Пафос": [34.7754, 32.4242],
};

function initMap() {
  if (leafletMap) return;
  leafletMap = L.map("leaflet-map", { zoomControl: true }).setView([34.9, 33.1], 9);
  L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
    attribution: "© OpenStreetMap", maxZoom: 18,
  }).addTo(leafletMap);
  updateMapMarkers();
}

function updateMapMarkers() {
  if (!leafletMap) return;
  leafletMap.eachLayer(l => { if (l instanceof L.Marker) leafletMap.removeLayer(l); });
  let placed = 0;
  allEvents.forEach((e, idx) => {
    const city = e.city || e.venue || "";
    let coords = null;
    for (const [name, c] of Object.entries(CITY_COORDS)) {
      if (city.toLowerCase().includes(name.toLowerCase())) { coords = c; break; }
    }
    if (!coords) return;
    const cat = e.category || "other";
    const icon = L.divIcon({
      html: `<div style="font-size:22px;line-height:1;">${CAT_EMOJI[cat]||"📌"}</div>`,
      className: "", iconSize: [28, 28], iconAnchor: [14, 14]
    });
    const jLat = coords[0] + (Math.random() - 0.5) * 0.01;
    const jLng = coords[1] + (Math.random() - 0.5) * 0.01;
    L.marker([jLat, jLng], { icon })
      .addTo(leafletMap)
      .bindPopup(`<b>${getTitle(e)}</b><br>${e.date||""}<br>${city}`, { maxWidth: 220 })
      .on("click", () => openModal(idx));
    placed++;
  });
  const info = document.getElementById("map-info");
  if (info) info.textContent = `📍 ${lang==="ru"?"Событий на карте":"Events on map"}: ${placed}`;
}

// ── NAVIGATION ─────────────────────────────────────────────────
function showPage(page) {
  currentPage = page;
  document.querySelectorAll(".page").forEach(p => p.classList.remove("active"));
  document.querySelectorAll(".nav-item").forEach(n => n.classList.remove("active"));
  document.getElementById("page-" + page).classList.add("active");
  document.getElementById("nav-btn-" + page).classList.add("active");

  const searchWrap = document.getElementById("search-wrap");
  const citiesEl = document.getElementById("cities");
  const catsEl = document.getElementById("cats");
  const isHome = page === "events";
  searchWrap.style.display = isHome ? "" : "none";
  citiesEl.style.display = isHome ? "" : "none";
  catsEl.style.display = isHome ? "" : "none";

  if (page === "soon") renderSoon();
  if (page === "map") setTimeout(initMap, 50);
  if (page === "fav") renderFav();
}

// ── CITIES ────────────────────────────────────────────────────
function renderCities() {
  document.getElementById("cities").innerHTML = CITIES.map(c =>
    `<button class="city-btn${currentCity===c?' active':''}" onclick="setCity('${c}')">${T[lang].cities[c]||c}</button>`
  ).join("");
}

function setCity(city) {
  currentCity = city;
  renderCities();
  render();
}

// ── CATS ──────────────────────────────────────────────────────
function renderCats() {
  const cats = ["all","nightlife","music","art","food","networking","culture","outdoor","sport","kids"];
  document.getElementById("cats").innerHTML = cats.map(c =>
    `<button class="cat-btn${currentCat===c?' active':''}" onclick="setCat('${c}')">${T[lang].cats[c]}</button>`
  ).join("");
}

function setCat(cat) {
  currentCat = cat;
  renderCats();
  render();
}

// ── UTILS ─────────────────────────────────────────────────────
function esc(s) { return String(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
function getTitle(e) { return (lang === "en" && e.title_en) ? e.title_en : (e.title || ""); }
function getBody(e) { return (lang === "en" && e.full_text_en) ? e.full_text_en : (e.full_text || ""); }

const RU_MONTHS = { "января":0,"февраля":1,"марта":2,"апреля":3,"мая":4,"июня":5,"июля":6,"августа":7,"сентября":8,"октября":9,"ноября":10,"декабря":11 };
const EN_MONTHS_MAP = { jan:0,feb:1,mar:2,apr:3,may:4,jun:5,jul:6,aug:7,sep:8,oct:9,nov:10,dec:11,
  january:0,february:1,march:2,april:3,june:5,july:6,august:7,september:8,october:9,november:10,december:11 };

function parseEventDate(str) {
  if (!str) return null;
  // "2026-06-30"
  if (/^\d{4}-\d{2}-\d{2}/.test(str)) return new Date(str);
  // "30 Jun 2026" или "30 June 2026" (формат Firebase)
  const mEn = str.match(/^(\d{1,2})\s+([A-Za-z]+)\s+(\d{4})/);
  if (mEn) {
    const mon = EN_MONTHS_MAP[mEn[2].toLowerCase()];
    if (mon !== undefined) return new Date(parseInt(mEn[3]), mon, parseInt(mEn[1]));
  }
  // "30 Jun" без года — текущий год
  const mEnNoYear = str.match(/^(\d{1,2})\s+([A-Za-z]+)$/);
  if (mEnNoYear) {
    const mon = EN_MONTHS_MAP[mEnNoYear[2].toLowerCase()];
    if (mon !== undefined) return new Date(new Date().getFullYear(), mon, parseInt(mEnNoYear[1]));
  }
  // "30 июня 2026" (русский с годом)
  const mRu = str.match(/(\d{1,2})\s+([а-яёА-ЯЁ]+)\s*[,]?\s*(\d{4})/);
  if (mRu) {
    const mon = RU_MONTHS[mRu[2].toLowerCase()];
    const year = parseInt(mRu[3]);
    if (mon !== undefined) return new Date(year, mon, parseInt(mRu[1]));
  }
  // "30 июня" без года
  const mRuNoYear = str.match(/(\d{1,2})\s+([а-яёА-ЯЁ]+)/);
  if (mRuNoYear) {
    const mon = RU_MONTHS[mRuNoYear[2].toLowerCase()];
    if (mon !== undefined) return new Date(new Date().getFullYear(), mon, parseInt(mRuNoYear[1]));
  }
  return null;
}

function isExpired(e) {
  const d = parseEventDate(e.date);
  if (!d) return false;
  const today = new Date(); today.setHours(0,0,0,0);
  return d < today;
}

// "Сегодня", "Завтра", "Вт 24 июн" и т.д.
function smartDate(str) {
  const d = parseEventDate(str);
  if (!d) return str || "";
  const today = new Date(); today.setHours(0,0,0,0);
  const diff = Math.round((d - today) / 86400000);
  if (diff === 0) return lang === "ru" ? "Сегодня" : "Today";
  if (diff === 1) return lang === "ru" ? "Завтра" : "Tomorrow";
  // "Эта пятница" — если в течение 7 дней и это пятница
  if (diff > 0 && diff <= 6) {
    const days_ru = ["Вс","Пн","Вт","Ср","Чт","Пт","Сб"];
    const days_en = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
    const months_ru = ["янв","фев","мар","апр","май","июн","июл","авг","сен","окт","ноя","дек"];
    const months_en = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
    const dn = lang==="ru" ? days_ru[d.getDay()] : days_en[d.getDay()];
    const mn = lang==="ru" ? months_ru[d.getMonth()] : months_en[d.getMonth()];
    return `${dn}, ${d.getDate()} ${mn}`;
  }
  // Для дат дальше — просто форматируем красиво
  const months_ru = ["янв","фев","мар","апр","май","июн","июл","авг","сен","окт","ноя","дек"];
  const months_en = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  const mn = lang==="ru" ? months_ru[d.getMonth()] : months_en[d.getMonth()];
  return `${d.getDate()} ${mn}`;
}

// ── RENDER CARDS ──────────────────────────────────────────────
function buildCard(e, idx) {
  const title = esc(getTitle(e));
  const cat = e.category || "other";
  const emoji = CAT_EMOJI[cat] || "📌";
  const catColor = CAT_COLOR[cat] || "#C9A84C";
  const catLabel = (T[lang].cats[cat] || "").replace(/^[^\s]+\s/, "");
  const hasUrl = e.url && e.url.startsWith("http");
  const favs = getFavIds();
  const isFav = favs.has(e.id);

  const dateStr = e.date ? smartDate(e.date) : "";
  let meta = "";
  if (dateStr) meta += `<span class="meta-item">📅 ${esc(dateStr)}</span>`;
  if (e.venue) meta += `<span class="meta-item">📍 ${esc(e.venue)}</span>`;
  else if (e.city && e.city !== "Cyprus") meta += `<span class="meta-item">📍 ${esc(e.city)}</span>`;
  if (e.price) meta += `<span class="meta-item">💰 <strong>${esc(e.price)}</strong></span>`;

  const photo = e.photo_url ? `<img class="card-img" src="${esc(e.photo_url)}" alt="" loading="lazy" onerror="this.style.display='none'">` : "";

  return `
  <div class="card" onclick="openModal(${idx})">
    ${photo}
    <div class="card-cat-bar" style="background:${catColor};"></div>
    <button class="fav-btn${isFav?' active':''}" onclick="event.stopPropagation();toggleFav('${e.id}',this)">${isFav?'♥':'♡'}</button>
    <div class="card-body">
      <div class="card-top">
        <div class="card-cat-label">${catLabel}</div>
        <div class="card-emoji">${emoji}</div>
      </div>
      <div class="card-title">${title}</div>
      ${meta ? `<div class="card-meta">${meta}</div>` : ""}
    </div>
    ${hasUrl ? `<div class="card-footer"><button class="btn-ticket" onclick="event.stopPropagation();openUrl('${e.url.replace(/'/g,"\\'")}')">🎟 ${T[lang].tickets}</button></div>` : ""}
  </div>`;
}

function matchCity(e) {
  if (currentCity === "all") return true;
  const c = (e.city || "").toLowerCase();
  return c.includes(currentCity.toLowerCase()) || (currentCity === "Limassol" && (c.includes("lemesos") || c.includes("limassol")));
}

const MINIAPP_NOISE = [
  // спортивные новости
  "breaks record","world record","premier league","super rugby","transfer","signing",
  "squad","thrash","group a:","group b:","group c:","group d:","match report",
  "lodge fifa","travel restrictions","ronaldo","arsenal","manchester","barcelona",
  "waltham cross",
  // политика/погода/происшествия/ДТП
  "braces for","meteorolog","judge orders","stand trial",
  "dies at","passed away","parliament","government","ceasefire","conflict",
  "road fatalities","road deaths","road accident","traffic accident",
  "fatal crash","killed in","fatalities","reduction in road","etsc","road safety report",
  "per cent reduction","heat dome","extreme heat","deadly furnace","prolonged extreme",
  "clear weather","isolated showers","thunderstorms","weather forecast","mostly clear",
  "погода на","прогноз погоды",
  "годовщина","anniversary of","день победы",
  "erdogan","trump","nato","biden","putin","zelensky","macron",
  "orders talks","turkish president","orders officials","seminary","diplomatic","sanctions",
  "foreign minister","summit","white house","kremlin","pentagon","european commission",
  "stock market","nasdaq","bitcoin price",
  // сетевой/инвест-спам
  "networking club","закрытая встреча","иммиграционными",
  "автобус протаранил","памятные мероприятия","годовщине начала",
  // архивные сводки от vkcyprus
  "события культуры","куда пойти на выходных","чем заняться на выходных",
  "афиша на выходные","события: август","события: июнь","события: июль","события: сентябрь",
  // туризм/экономика/статистика
  "arrivals fall","tourism impact manageable","per cent reduction",
  "собрала звёзд","собрал звёзд","gathered stars",
  "says tourism","tourism slump","tourist arrivals","flights resume","flights r",
];
const MINIAPP_BAD_SOURCES = ["cyprus-mail-sport","cyprus-mail-athletics"];

// Заголовки с устаревшим годом (2013–2025)
const OLD_YEAR_RE = /\b20(1[3-9]|2[0-5])\b/;

function isNoise(e) {
  if (MINIAPP_BAD_SOURCES.includes(e.source)) return true;
  const title = (e.title||"");
  if (OLD_YEAR_RE.test(title)) return true;
  const text = (title+" "+(e.full_text||"")).toLowerCase();
  if (MINIAPP_NOISE.some(p => text.includes(p))) return true;
  // Общие «что делать на выходных» сводки и спорт-матчи
  if (/^(what.s on this|match in|матч|сводка)/i.test(title)) return true;
  if (/^афиша[:\s]*(мероприятий|на выходные)/i.test(title)) return true;
  if (/^«?пейте вино/i.test(title)) return true;
  return false;
}

function render() {
  const q = searchQuery.toLowerCase();
  const filtered = allEvents.filter(e => {
    if (isNoise(e)) return false;
    if (isExpired(e)) return false;
    if (!e.category || e.category === "other") return false;
    if (currentCat !== "all" && e.category !== currentCat) return false;
    if (!matchCity(e)) return false;
    if (!q) return true;
    return ((e.title||"")+" "+(e.title_en||"")+" "+(e.full_text||"")+" "+(e.venue||"")).toLowerCase().includes(q);
  });
  const el = document.getElementById("events");
  if (!filtered.length) { el.innerHTML = `<div class="empty">◈<br><br>${T[lang].empty}</div>`; return; }
  el.innerHTML = filtered.map(e => buildCard(e, allEvents.indexOf(e))).join("");
}

// ── SOON ──────────────────────────────────────────────────────
function renderSoon() {
  const el = document.getElementById("soon-list");
  if (!allEvents.length) { el.innerHTML = `<div class="loading"><div class="spinner"></div></div>`; return; }
  const now = new Date(); now.setHours(0,0,0,0);
  const withDate = allEvents
    .filter(e => e.date)
    .map(e => { const d = parseEventDate(e.date); return { ...e, _ts: d ? d.getTime() : Infinity }; })
    .filter(e => e._ts >= now.getTime() || e._ts === Infinity)
    .sort((a, b) => a._ts - b._ts)
    .slice(0, 30);
  if (!withDate.length) { el.innerHTML = `<div class="empty">◈<br><br>${T[lang].empty}</div>`; return; }
  el.innerHTML = withDate.map(e => buildCard(e, allEvents.indexOf(e))).join("");
}

// ── FAVOURITES ────────────────────────────────────────────────
function renderFav() {
  const el = document.getElementById("fav-list");
  const favs = getFavIds();
  const favEvents = allEvents.filter(e => favs.has(e.id));
  if (!favEvents.length) { el.innerHTML = `<div class="empty">♡<br><br>${T[lang].favEmpty}</div>`; return; }
  el.innerHTML = favEvents.map(e => buildCard(e, allEvents.indexOf(e))).join("");
}

// ── MODAL ─────────────────────────────────────────────────────
function openModal(idx) {
  const e = allEvents[idx];
  if (!e) return;

  const cat = e.category || "other";
  const emoji = CAT_EMOJI[cat] || "📌";
  const catLabel = (T[lang].cats[cat] || "").replace(/^[^\s]+\s/, "");
  const catColor = CAT_COLOR[cat] || "#C9A84C";
  const hasUrl = e.url && e.url.startsWith("http");

  // фото в начале модалки
  const modalEl = document.getElementById("modal");
  let imgEl = modalEl.querySelector(".modal-img");
  if (e.photo_url) {
    if (!imgEl) {
      imgEl = document.createElement("img");
      imgEl.className = "modal-img";
      imgEl.alt = "";
      imgEl.loading = "lazy";
      imgEl.onerror = () => imgEl.style.display = "none";
      modalEl.insertBefore(imgEl, modalEl.firstChild);
    }
    imgEl.src = e.photo_url;
    imgEl.style.display = "";
  } else if (imgEl) {
    imgEl.style.display = "none";
  }

  document.getElementById("modal-cat").textContent = emoji + " " + catLabel;
  document.getElementById("modal-cat").style.color = catColor;
  document.getElementById("modal-title").textContent = getTitle(e);

  const dateStr = e.date ? smartDate(e.date) : "";
  let meta = "";
  if (dateStr) meta += `<span class="meta-item">📅 ${esc(dateStr)}</span>`;
  if (e.venue) meta += `<span class="meta-item">📍 ${esc(e.venue)}</span>`;
  if (e.city && e.city !== "Cyprus") meta += `<span class="meta-item">🌍 ${esc(e.city)}</span>`;
  if (e.price) meta += `<span class="meta-item">💰 <strong>${esc(e.price)}</strong></span>`;
  document.getElementById("modal-meta").innerHTML = meta;

  document.getElementById("modal-body").textContent = getBody(e);

  let footerHtml = "";
  if (hasUrl) footerHtml += `<button class="btn-ticket" onclick="openUrl('${e.url.replace(/'/g,"\\'")}')">🎟 ${T[lang].tickets}</button>`;
  footerHtml += `<button class="btn-share" onclick="shareEvent(${idx})">↗ ${T[lang].share}</button>`;
  document.getElementById("modal-footer").innerHTML = footerHtml;

  document.getElementById("modal-overlay").classList.add("open");
  document.body.style.overflow = "hidden";
}

function closeModal(evt) {
  if (evt && evt.target !== document.getElementById("modal-overlay") && !evt.target.classList.contains("modal-close")) return;
  document.getElementById("modal-overlay").classList.remove("open");
  document.body.style.overflow = "";
}

// ── SHARE ─────────────────────────────────────────────────────
function shareEvent(idx) {
  const e = allEvents[idx];
  if (!e) return;
  const title = getTitle(e);
  const url = e.url && e.url.startsWith("http") ? e.url : "https://t.me/WrPtCy";
  const text = `${title}\n\n${url}`;
  if (tg && tg.shareUrl) {
    tg.shareUrl(url, title);
  } else if (navigator.share) {
    navigator.share({ title, url }).catch(() => {});
  } else {
    navigator.clipboard?.writeText(text).catch(() => {});
    alert(text);
  }
}

// ── URL ───────────────────────────────────────────────────────
function openUrl(url) {
  if (tg) tg.openLink(url);
  else window.open(url, "_blank");
}

// ── FIREBASE ──────────────────────────────────────────────────
async function loadEvents() {
  if (!fbReady) return;
  try {
    const { collection, query, orderBy, limit, getDocs } = window._fs;
    const db = window._db;
    const q = query(collection(db,"events"), orderBy("created_at","desc"), limit(150));
    const snap = await getDocs(q);
    allEvents = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    render();
    if (currentPage === "soon") renderSoon();
    if (currentPage === "map") updateMapMarkers();
    if (currentPage === "fav") renderFav();
  } catch(err) {
    document.getElementById("events").innerHTML = `<div class="empty">⚠ ${err.message}</div>`;
  }
}

// ── SEARCH ────────────────────────────────────────────────────
let st;
document.getElementById("search").addEventListener("input", e => {
  clearTimeout(st);
  st = setTimeout(() => { searchQuery = e.target.value; render(); }, 250);
});

// ── INIT ──────────────────────────────────────────────────────
setLang("ru");

function waitForFirebase() {
  if (window._db && window._fs) { fbReady = true; loadEvents(); }
  else setTimeout(waitForFirebase, 100);
}
waitForFirebase();
</script>
